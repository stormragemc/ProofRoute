name: ProofRoute research check

on:
  workflow_dispatch:
    inputs:
      question:
        description: Research question
        required: true
        type: string
        default: Does the browser Web Speech API guarantee on-device speech recognition with its default settings?
  push:
    branches: [main]
    paths: [.github/workflows/research.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the project
        run: python -m pip install -r requirements.txt
      - name: Check the evidence rules offline
        run: python -m unittest discover -s tests -v
      - name: Run the live research question
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NEBIUS_MODEL: ${{ vars.NEBIUS_MODEL }}
          USER_QUESTION: ${{ inputs.question }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -z "$NEBIUS_API_KEY" || -z "$TAVILY_API_KEY" ]]; then
            echo 'Live check needs both repository secrets, NEBIUS_API_KEY and TAVILY_API_KEY.'
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then exit 1; fi
            echo 'Offline checks completed. Run this workflow manually after adding the keys.'
            exit 0
          fi
          python src/agent.py --require-citation --output research-run.json -- "$USER_QUESTION" >/dev/null
          python - <<'PY'
          import json
          with open("research-run.json") as f:
              result = json.load(f)
          cited = sum(bool(f["evidence"]) for f in result["findings"])
          print(f'{cited} of {len(result["findings"])} requirements have checked quotations.')
          print(f'{len(result["sources"])} pages supplied passages. See the research-run artifact.')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('research-run.json') != '' }}
        with:
          name: research-run
          path: research-run.json
          retention-days: 7
